<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366F6" />
    <meta name="color-scheme" content="light dark" />
    <!-- Mavzu birinchi bo'yashdan oldin qo'llanadi (qorong'i rejimda oq chaqnash bo'lmasin). Mantiq: src/lib/theme.js -->
    <script>
      (function () {
        var mode = 'system'
        try { mode = JSON.parse(localStorage.getItem('ayolkaryera_v1')).prefs.theme || mode } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161722')
      })()
    </script>
    <meta name="description" content="AyolQadami — ayollar uchun ish, rezyume, QadamAI va o'quv kurslari platformasi" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>AyolQadami</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Telegram Mini App SDK (oddiy brauzerda ta'sirsiz); defer — sahifa yuklanishini to'xtatmaydi va main.jsx dan oldin bajariladi -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
